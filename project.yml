name: Shipped
options:
  bundleIdPrefix: com.vincent.shipped
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: "4.5.0"

# Personal, gitignored — see Config.xcconfig.example.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"

targets:
  ShippediOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: iOS
      - path: Resources
      - path: SharedResources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vincent.shipped.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: Shipped
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOTTIE_LINKED"
    entitlements:
      path: iOS/ShippediOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.vincent.shipped
    dependencies:
      - package: Lottie
        product: Lottie
      - target: ShippedWidgetExtension
        embed: true

  ShippedWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vincent.shipped.ios.widget
        INFOPLIST_KEY_CFBundleDisplayName: Shipped Widget
        GENERATE_INFOPLIST_FILE: true
    entitlements:
      path: Widget/ShippedWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.vincent.shipped
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ShippedMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Shared
      - path: macOS
      - path: MacResources
      - path: SharedResources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vincent.shipped.mac
        INFOPLIST_KEY_CFBundleDisplayName: Shipped
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: false
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOTTIE_LINKED"
    dependencies:
      - package: Lottie
        product: Lottie
    entitlements:
      path: macOS/ShippedMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.vincent.shipped

schemes:
  ShippediOS:
    build:
      targets:
        ShippediOS: all
    run:
      config: Debug
  ShippedMac:
    build:
      targets:
        ShippedMac: all
    run:
      config: Debug
